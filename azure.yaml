# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: poc-decide-something
metadata:
  template: poc-decide-something
infra:
  provider: bicep
  path: infra
  name: poc-decide-something # this is the linchpin that enables azd env refresh (and avoids strange azd behavior)
  # Requires `azd config set alpha.deployment.stacks on` (enforced by preprovision).
  # The stack manages the model deployment on the shared Foundry account plus the
  # anonymous proxy's own resource group. `azd down` deletes those; the shared
  # Foundry resource group is only referenced, so the stack never manages it.
  deploymentStacks:
    actionOnUnmanage:
      resources: delete
      resourceGroups: delete
    denySettings:
      mode: none

services:
  # Rate-limited proxy for unauthenticated use. Refuses all requests unless
  # ANONYMOUS_MODE=true at provision time.
  api:
    project: ./api
    language: js
    host: function

hooks:
  preprovision:
    shell: sh
    run: ruby scripts/exe/preprovision
  postprovision:
    shell: sh
    run: ruby scripts/exe/postprovision
  predeploy:
    shell: sh
    run: ruby scripts/exe/predeploy
  postdeploy:
    shell: sh
    run: ruby scripts/exe/postdeploy
  predown:
    shell: sh
    run: ruby scripts/exe/predown
  postdown:
    shell: sh
    run: ruby scripts/exe/postdown
