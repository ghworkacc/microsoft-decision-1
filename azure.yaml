# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: poc-decide-something
metadata:
  template: poc-decide-something
infra:
  provider: bicep
  path: infra
  name: poc-decide-something # this is the linchpin that enables azd env refresh (and avoids strange azd behavior)
  # Requires `azd config set alpha.deployment.stacks on` (enforced by preprovision).
  # The stack manages only the model deployment on the shared Foundry account,
  # so `azd down` deletes that deployment and detaches (never deletes) resource groups.
  deploymentStacks:
    actionOnUnmanage:
      resources: delete
      resourceGroups: detach
    denySettings:
      mode: none

hooks:
  preprovision:
    shell: sh
    run: ruby scripts/exe/preprovision
  postprovision:
    shell: sh
    run: ruby scripts/exe/postprovision
  predeploy:
    shell: sh
    run: ruby scripts/exe/predeploy
  postdeploy:
    shell: sh
    run: ruby scripts/exe/postdeploy
  predown:
    shell: sh
    run: ruby scripts/exe/predown
  postdown:
    shell: sh
    run: ruby scripts/exe/postdown
